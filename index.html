<!DOCTYPE html>
<html lang="en">
<head>
<link rel="schema.dcterms" href="http://purl.org/dc/terms/">
<meta name="dcterms.rights" content="CC-BY-4.0">
<meta name="dcterms.rightsHolder" content="https://github.com/casperdcl">
<meta name="dcterms.dateCopyrighted" content="2026">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>raw-content</title>
<style>
  body { font-family: monospace; max-width: 48em; margin: 2em auto; padding: 0 1em; }
  h1 { word-break: break-all; }
  a { color: #0969da; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.25em 0; }
  li::before { content: "📄 "; }
  li.tree::before { content: "📁 "; }
  .error { color: #cf222e; }
  .hint { color: #656d76; font-size: 0.9em; }
</style>
</head>
<body>
<h1 id="dirname">.</h1>
<a id="up">..</a>
<div id="listing">Loading...</div>
<script>
var path = window.location.search.substring(1).split('/').filter(Boolean);
const owner = path.shift();
const repo = path.shift();
const branch = path.shift();
if (!owner || !repo || !branch) {
  document.getElementById('dirname').textContent = 'Invalid URL format';
  document.getElementById('listing').innerHTML = '<p class="hint">Expected: ' + window.location.host + '?OWNER/REPO/BRANCH/path/to/directory</p>';
  throw new Error('Invalid URL format');
}
document.getElementById('dirname').textContent = window.location.search.substring(1);
document.getElementById('up').href = window.location.href.split('/').slice(0, -1).join('/');
document.getElementsByTagName('title')[0].textContent = `${path.join('/') || '/'} | ${owner}/${repo}`;
var listing = document.getElementById('listing');

function showError(message) {
  listing.innerHTML = '<p class="error">' + message + '</p>';
}

function checkResponse(response) {
  if (!response.ok) {
    if (response.status === 404) throw new Error('Not found — check that the repository, branch, and path exist');
    if (response.status === 403) throw new Error('Rate limited — try again later or use an authenticated request');
    throw new Error(response.status + ' ' + response.statusText);
  }
  return response.json();
}

function traverse(tree, path) {
  if (path.length === 0) return tree;
  const next = path.shift();
  const entry = tree.tree.find(x => x.path === next);
  if (!entry) throw new Error('Path not found: ' + next);
  if (entry.type === 'blob') {
    var filePath = window.location.search.substring(1).split('/').slice(3).join('/');
    window.location.replace(`https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${branch}/${filePath}`);
    return null;
  }
  return fetch(entry.url).then(checkResponse).then(subtree => traverse(subtree, path));
}
var subdir = window.location.search.substring(1).split('/').slice(3).join('/');
fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}`)
  .then(checkResponse)
  .then(tree => traverse(tree, path))
  .then(dir => {
    if (!dir) return;
    listing.innerHTML = '<ul>' + dir.tree.map(
      x => `<li class="${x.type}"><a href="${
        x.type == 'tree' ? window.location.href : `https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${branch}/${
          subdir ? subdir + '/' : ''
        }`
      }${x.path}">${x.path}</a></li>`
    ).join('') + '</ul>';
  })
  .catch(error => showError(error.message));
</script>
</body>
</html>
